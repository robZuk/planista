# Srodowisko DEWELOPERSKIE — kompletne i samodzielne.
#   make dev   albo   docker compose up
# Hot-reload: kod montowany z dysku, backend tsx watch, frontend Vite HMR.
# (Wariant produkcyjny jest w osobnym, tez kompletnym pliku: docker-compose.prod.yml)
name: planista

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: planista7
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Baza tylko w sieci wewnetrznej (internal: true) — niedostepna z internetu ani dla frontu.
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d planista7']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: planista-backend-dev
    build:
      context: ./backend
      target: dev
    command: npm run dev
    environment:
      PORT: 4001
      DATABASE_URL: postgresql://postgres:password@db:5432/planista7?schema=public
      # Sekrety deweloperskie — jawne, bo to tylko lokalne srodowisko.
      JWT_ACCESS_SECRET: dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
      CORS_ORIGIN: http://localhost:5174
    volumes:
      # Kod z dysku -> hot-reload; anonimowy wolumen chroni node_modules z obrazu.
      - ./backend:/app
      - /app/node_modules
    networks:
      - internal
      - edge
    ports:
      # Bind na localhost — nie wystawiamy dev na LAN.
      - '127.0.0.1:4001:4001'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: planista-frontend-dev
    build:
      context: ./frontend
      target: dev
    command: npm run dev -- --host
    environment:
      # Vite proxuje /api na kontener backendu (nazwa uslugi w sieci compose).
      VITE_PROXY_TARGET: http://backend:4001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - edge
    ports:
      - '127.0.0.1:5174:5174'
    depends_on:
      - backend

volumes:
  pgdata:

networks:
  # Warstwa brzegowa: front <-> backend.
  edge:
  # Warstwa wewnetrzna: backend <-> baza. internal: true = brak trasy do internetu.
  internal:
    internal: true
