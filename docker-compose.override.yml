# Nadpisania DEWELOPERSKIE — Compose laduje ten plik AUTOMATYCZNIE przy `docker compose up`.
# Roznica wzgledem bazy: obrazy w targecie 'dev', kod montowany z dysku (hot-reload),
# porty odsloniete, sekrety deweloperskie wprost.
services:
  # db bez portu na hosta — jest w sieci 'internal' (internal: true), ktora z zasady
  # nie publikuje portow. Baza jest osiagalna WYLACZNIE dla backendu, tak samo jak w
  # prod. (Konsekwencja: natywny `npm run dev` nie dosiegnie tej bazy — pracujemy
  # przez kontenery. Gdyby byl potrzebny natywny dostep, to swiadoma, osobna decyzja.)

  backend:
    # Osobny tag niz prod — inaczej build jednego srodowiska nadpisuje obraz drugiego.
    image: planista-backend-dev
    build:
      target: dev
    command: npm run dev
    environment:
      # Sekrety deweloperskie — jawne, bo to tylko lokalne srodowisko.
      JWT_ACCESS_SECRET: dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
      CORS_ORIGIN: http://localhost:5174
    volumes:
      # Kod z dysku -> hot-reload. Anonimowy wolumen na node_modules, zeby bind
      # z hosta NIE przyslonil zaleznosci zainstalowanych w obrazie.
      - ./backend:/app
      - /app/node_modules
    ports:
      # Bind na localhost — backend dev nie wystawiony na LAN.
      - '127.0.0.1:4001:4001'

  frontend:
    image: planista-frontend-dev
    build:
      target: dev
    command: npm run dev -- --host
    environment:
      # Vite proxuje /api na kontener backendu (nazwa uslugi w sieci compose).
      VITE_PROXY_TARGET: http://backend:4001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      # Bind na localhost — front dev nie wystawiony na LAN.
      - '127.0.0.1:5174:5174'
