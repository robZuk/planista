# Konfiguracja nginx dla produkcyjnego frontu (kontener 'runner').
# Zadania: (1) podac statyki SPA z fallbackiem na index.html,
#          (2) przekazac /api i /health na kontener backendu,
#          (3) poprawny cache: zahashowane assety na dlugo, index.html bez cache.
server {
  listen 80;

  # API i health -> backend (nazwa uslugi z docker-compose, port wewnetrzny 4001).
  location /api {
    proxy_pass http://backend:4001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /health {
    proxy_pass http://backend:4001;
  }

  # Zahashowane assety Vite (np. index-ab12cd.js) — nazwa zmienia sie przy zmianie
  # tresci, wiec mozna cache'owac agresywnie (rok, immutable).
  location /assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA: kazda inna sciezka oddaje index.html (routing przejmuje react-router).
  # index.html BEZ trwalego cache — przegladarka rewaliduje przy kazdym wejsciu,
  # wiec nowy deploy jest widoczny od razu, bez twardego odswiezania.
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
