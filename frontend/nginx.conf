# Konfiguracja nginx dla produkcyjnego frontu (kontener 'runner').
# Dwa zadania: (1) podac statyki SPA z fallbackiem na index.html,
#             (2) przekazac /api i /health na kontener backendu w sieci compose.
server {
  listen 80;

  # API i health -> backend (nazwa uslugi z docker-compose, port wewnetrzny 4001).
  location /api {
    proxy_pass http://backend:4001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /health {
    proxy_pass http://backend:4001;
  }

  # SPA: kazda inna sciezka oddaje index.html, a routing przejmuje react-router.
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
