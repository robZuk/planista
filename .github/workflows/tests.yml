# Reusable workflow — testy (lint + test + build) backendu i frontu.
# Definicja w JEDNYM miejscu; wolana przez ci.yml (push/PR) i deploy.yml (brama przed
# wdrozeniem) przez `uses: ./.github/workflows/tests.yml`. Root nie ma package.json,
# wiec backend i frontend to osobne joby (rownolegle). Testy nie wymagaja bazy.
name: Tests

on:
  workflow_call:

jobs:
  backend:
    name: Backend (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate # typy Prismy — bez nich tsc padnie
      - run: npm run lint
      - run: npm test
      - run: npm run build

  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
